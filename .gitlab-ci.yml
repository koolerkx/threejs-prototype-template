# Publishes the prototype to GitLab Pages when `prod` is pushed (same trigger as .github/workflows/pages.yml).
# CI runs no tests; `main` is the working branch.
pages:
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
  variables:
    YARN_ENABLE_GLOBAL_CACHE: "false" # keep the cache in .yarn/cache so GitLab can cache it
  cache:
    key:
      files: [yarn.lock]
    paths: [.yarn/cache]
  script:
    - corepack enable
    - yarn install --immutable
    - yarn build
  pages:
    publish: dist
  artifacts:
    paths:
      - dist
